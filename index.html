<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CY Stainless Steel Enterprise - Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #4a4a4a;
            background-image: radial-gradient(#3a3a3a 1px, transparent 0);
            background-size: 8px 8px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .calculator-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .form-group label {
            width: 110px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #d1d1d1;
        }
        .colon {
            width: 20px;
            text-align: center;
            font-weight: bold;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: #2b2b2b;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #666;
        }
        .btn-counter {
            width: 36px;
            height: 36px;
            background: #3a3a3a;
            border: 1px solid #555;
            color: white;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .btn-counter:active {
            background: #555;
        }
        .result-box {
            background: #242424 !important;
            font-weight: bold;
            color: #00ffcc !important;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="title" id="appTitle">CY Stainless Steel Enterprise</div>

    <div class="form-group">
        <label>Height</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="height" placeholder="Height (mm)" oninput="calculateGap()">
        </div>
    </div>

    <div class="form-group">
        <label>Hollow</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="hollow" placeholder="Hollow size (mm)" oninput="calculateGap()">
        </div>
    </div>

    <div class="form-group">
        <label>Long Gap</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="longGap" placeholder="Max gap (mm)" oninput="calculateGap()">
        </div>
    </div>

    <div class="form-group">
        <label>Short Gap</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="shortGap" placeholder="Min gap (mm)" oninput="calculateGap()">
        </div>
    </div>

    <div class="form-group">
        <label>Strips</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="strips" value="0" readonly>
            <div class="btn-counter" onclick="adjustStrips(1)">+</div>
            <div class="btn-counter" onclick="adjustStrips(-1)">-</div>
        </div>
    </div>

    <div class="form-group">
        <label>Gap</label>
        <span class="colon">:</span>
        <div class="input-wrapper">
            <input type="number" id="gap" class="result-box" readonly placeholder="0.00">
        </div>
    </div>
</div>

<script>
    function calculateGap() {
        const height = parseFloat(document.getElementById('height').value);
        const hollow = parseFloat(document.getElementById('hollow').value);
        const longGap = parseFloat(document.getElementById('longGap').value);
        const shortGap = parseFloat(document.getElementById('shortGap').value);

        if (!height || !hollow || !longGap || !shortGap) {
            document.getElementById('gap').value = '';
            document.getElementById('strips').value = 0;
            return;
        }

        // Auto calculate optimal strips count
        let bestStrips = 1;
        let found = false;

        for (let s = 1; s <= 100; s++) {
            let totalHollowWidth = s * hollow;
            let totalSpace = height - totalHollowWidth;
            let currentGap = totalSpace / (s + 1);

            if (currentGap >= shortGap && currentGap <= longGap) {
                bestStrips = s;
                found = true;
                break;
            }
        }

        if (!found) {
            // Fallback estimation
            bestStrips = Math.round((height - shortGap) / (hollow + shortGap));
            if (bestStrips < 1) bestStrips = 1;
        }

        document.getElementById('strips').value = bestStrips;
        computeResult(bestStrips, height, hollow);
    }

    function adjustStrips(delta) {
        let stripsInput = document.getElementById('strips');
        let currentStrips = parseInt(stripsInput.value) || 0;
        let newStrips = currentStrips + delta;

        if (newStrips < 0) newStrips = 0;
        stripsInput.value = newStrips;

        const height = parseFloat(document.getElementById('height').value);
        const hollow = parseFloat(document.getElementById('hollow').value);

        if (height && hollow) {
            computeResult(newStrips, height, hollow);
        }
    }

    function computeResult(strips, height, hollow) {
        let totalHollowWidth = strips * hollow;
        let totalSpace = height - totalHollowWidth;
        let gap = totalSpace / (strips + 1);

        if (gap < 0) {
            document.getElementById('gap').value = "Error";
        } else {
            document.getElementById('gap').value = gap.toFixed(2);
        }
    }
</script>

</body>
</html>
